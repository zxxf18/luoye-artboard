server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    location = /health {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ok":true,"app":"luoye-artboard"}';
    }

    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /app.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /android-bridge.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /canvas-assets.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /assets/catalog.js {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|mid|midi|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # This is a static editor without client-side routes. Keep the root
    # document explicit so a missing JS/CSS/image cannot be masked by HTML.
    location = / {
        include /etc/nginx/security-headers.conf;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
