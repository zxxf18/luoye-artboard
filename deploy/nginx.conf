server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"ok":true,"app":"luoye-artboard"}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /app.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /android-bridge.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /canvas-assets.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /assets/catalog.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|webp|svg|mid|midi|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
